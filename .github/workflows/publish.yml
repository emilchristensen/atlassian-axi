name: publish

# Manual publish of a single package to npm via TRUSTED PUBLISHING (OIDC).
# Use when a package's version is already bumped on main + tagged (e.g. by
# release-please) but the automated publish did not run/complete. Requires a
# trusted publisher for the package on npmjs.com (org emilchristensen, repo
# atlassian-axi, workflow publish.yml). No token; provenance is automatic.
# Builds from main and publishes whatever version is in the package's
# package.json.
#
# PUBLISH DISABLED ON THIS FORK: the job-level `if` guard skips this workflow
# unless it runs on the UPSTREAM repo, so a manual dispatch from the fork does
# nothing. We install from source (docs/INSTALL-FROM-FORK.md), never from npm.

on:
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Package directory to publish"
        required: true
        type: choice
        options:
          - packages/jira-axi
          - packages/confluence-axi

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'emilchristensen/atlassian-axi' }}
    steps:
      # Actions are SHA-pinned; trailing comment keeps the readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; pin an EXACT version.
      - run: npm install -g npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish ${{ inputs.package_dir }}
        run: cd "${{ inputs.package_dir }}" && npm publish --access public
