name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned (fork supply-chain hardening); trailing comment
      # keeps the human-readable version for upstream syncs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test

      # SKILL.md is a published artifact generated from src/skill.ts. Fail the
      # build when a committed copy has drifted, so agents never receive stale
      # command docs. Fix by running `pnpm run build:skill` and committing.
      - run: pnpm run build:skill -- --check
